# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind v split-window -h
bind s split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind < resize-pane -L 10
bind > resize-pane -R 10
bind - resize-pane -D 10
bind + resize-pane -U 10

# prevent slow escape
set -sg escape-time 0

set-window-option -g mode-keys vi

# y is not bound by default in copy-mode-vi; set-clipboard on makes any copy
# (y, Enter, mouse drag, double-click) emit OSC 52 to the attached client
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open selection in vim inside a popup with "x"
bind-key -T copy-mode-vi x send -X copy-pipe-and-cancel "sh -c 'cat > /tmp/tmuxedit; tmux popup -E \"vim /tmp/tmuxedit\"; tmux load-buffer /tmp/tmuxedit'"

#### COLOUR (Adaptive Solarized Light & Dark)

# Status bar blends with active terminal theme (cream on Light, dark slate on Dark)
set-option -g status-style fg=yellow,bg=default

# Inactive window title
set-window-option -g window-status-style fg=blue,bg=default

# Active window title (bold + reverse adapts cleanly to both Light and Dark)
set-window-option -g window-status-current-style fg=red,bg=default,bold

# Pane borders (subtle default border, high-contrast red active border)
set-option -g pane-border-style fg=default,dim
set-option -g pane-active-border-style fg=red

# Command / message prompt (reverse swaps your active theme's fg/bg automatically)
set-option -g message-style fg=yellow,bg=default,reverse

# Pane number display
set-option -g display-panes-active-colour blue
set-option -g display-panes-colour red

# Clock
set-window-option -g clock-mode-colour green

# Bell
set-window-option -g window-status-bell-style fg=red,bg=default,reverse

# terminal, true color & OSC 52 clipboard (tmux 3.2+ & mosh compatible)
set -g default-terminal "xterm-256color"
set -g set-clipboard on
set -g mouse on
set -as terminal-features ",*:RGB"
set -ag terminal-overrides ",*256col*:colors=256:Tc"
# mosh 1.4 only accepts OSC 52 with the 'c' clipboard selector; tmux 3.4
# natively emits an empty selector. Force 'c' while keeping both params so
# tiparm can expand the template.
set -ag terminal-overrides ",*:Ms=\\E]52;c;%p1%s%p2%s\\a"
set -ga update-environment " COLORTERM"

# Allow inner apps (Neovim, etc.) to emit OSC 52 directly through tmux
set -g allow-passthrough on

# use bracketed paste, if the running application (vim/emacs/weechat) has
# sent the terminal code to enable it.
bind-key ] paste-buffer -p

setw -g aggressive-resize on

# pane number display
set-option -g display-panes-active-colour blue #blue
set-option -g display-panes-colour brightred #orange

# clock
set-window-option -g clock-mode-colour green #green

# bell
set-window-option -g window-status-bell-style fg=black,bg=red #base02, red
