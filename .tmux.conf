# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind v split-window -h
bind s split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind < resize-pane -L 10
bind > resize-pane -R 10
bind - resize-pane -D 10
bind + resize-pane -U 10

# prevent slow escape
set -sg escape-time 0

set-window-option -g mode-keys vi

# Ensure 'y' in vi copy-mode yanks and triggers OSC 52 clipboard
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open selection in vim inside a popup with "x"
bind-key -T copy-mode-vi x send -X copy-pipe-and-cancel "sh -c 'cat > /tmp/tmuxedit; tmux popup -E \"vim /tmp/tmuxedit\"; tmux load-buffer /tmp/tmuxedit'"

#### COLOUR (Solarized dark)

# default statusbar colors
set-option -g status-style fg=yellow,bg=black #yellow and base02

# default window title colors
set-window-option -g window-status-style fg=brightblue,bg=default #base0 and default

# active window title colors
set-window-option -g window-status-current-style fg=brightred,bg=default #orange and default

# pane border
set-option -g pane-border-style fg=black #base02
set-option -g pane-active-border-style 'fg=brightred' #base01

# message text
set-option -g message-style fg=brightred,bg=black #orange and base01

# terminal, true color & OSC 52 clipboard (tmux 3.2+ & mosh compatible)
set -g default-terminal "xterm-256color"
set -g set-clipboard on
set -g mouse on
set -as terminal-features ",*:RGB"
set -ag terminal-overrides ",*256col*:colors=256:Tc"
set -ag terminal-overrides ",*:Ms=\\E]52;c;%p2%s\\a"
set -ga update-environment " COLORTERM"

# Allow inner apps (Neovim, etc.) to emit OSC 52 directly through tmux
set -g allow-passthrough on

# Force tmux copy-mode to write OSC 52 directly to the mosh client TTY
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'printf "\033]52;c;$(base64 | tr -d "\n")\a" > #{client_tty}'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'printf "\033]52;c;$(base64 | tr -d "\n")\a" > #{client_tty}'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'printf "\033]52;c;$(base64 | tr -d "\n")\a" > #{client_tty}'

# use bracketed paste, if the running application (vim/emacs/weechat) has
# sent the terminal code to enable it.
bind-key ] paste-buffer -p

setw -g aggressive-resize on

# pane number display
set-option -g display-panes-active-colour blue #blue
set-option -g display-panes-colour brightred #orange

# clock
set-window-option -g clock-mode-colour green #green

# bell
set-window-option -g window-status-bell-style fg=black,bg=red #base02, red
