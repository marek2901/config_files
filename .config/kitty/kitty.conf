# Kitty base configuration
# Generated for Mosh-friendly custom protocols and quick-access overlay

term xterm-256color

# Custom Protocol Regex: make custom URI schemes clickable over Mosh buffers
url_prefixes http https file zed vscode xcode cursor

# Link Handling
# Web URLs go through Velja (with prompt) when Velja is installed; otherwise
# they fall back to the normal macOS handler. Detection lives in
# smart_open_url.py and runs per-click (stdlib only), so install/uninstall of
# Velja takes effect without restarting kitty and no external deps are needed.
open_url_with /usr/bin/python3 ~/.config/kitty/smart_open_url.py
detect_urls yes
underline_hyperlinks hover
allow_hyperlinks yes
# Make URL opening easier on macOS (default is ctrl+shift+click, add cmd+click)
# cmd+click is more macOS-native; keep ctrl+shift+click as fallback
mouse_map cmd+left press ungrabbed,grabbed discard_event
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+left press ungrabbed,grabbed discard_event
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link
# Also handle plain ctrl+shift as default (keep)
mouse_map ctrl+shift+left press grabbed discard_event
mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_handle_click link

# Aesthetics
hide_window_decorations titlebar-only
window_padding_width 10
font_family JetBrainsMono Nerd Font
font_size 13.0
cursor_shape block
cursor_blink_interval 0

# Tab bar
tab_bar_style                   custom
tab_separator                   ""
tab_fade                        0 0 0 0
tab_title_template              "   {index}: {title}   "
active_tab_title_template       "   [ {index}: {title} ]   "
tab_bar_edge                    top
tab_bar_align                   left
tab_bar_margin_width            8.0
tab_bar_margin_height           8.0 4.0
active_tab_font_style           bold
inactive_tab_font_style         normal
tab_bar_min_tabs                2
tab_activity_symbol             none

# Disable standard window size memory for clean overlay behavior
remember_window_size no

# Native Quick-Access Hotkey - DISABLED: owned by Hammerspoon globally (cmd+esc/cmd+` → kitten quick-access-terminal)
# Kitty maps swallow the key when focused and break Hammerspoon's global hotkey + conflict with RegisterEventHotKey -9878
# Hammerspoon ~/.hammerspoon/init.lua handles both via hs.hotkey (cmd+`) + hs.eventtap (cmd+esc)
# action_alias kept for manual :action if needed
action_alias toggle_quick_access_terminal kitten quick-access-terminal

# Regular tab switching with Command+Number (macOS familiar shortcuts)
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# macOS familiar: cmd+l clear screen, cmd+enter fullscreen
map cmd+k clear_terminal reset active
map cmd+enter toggle_fullscreen
map cmd+return toggle_fullscreen
map cmd+ctrl+enter toggle_maximized

# window space between tabs

placement_strategy top-left
window_padding_width 0
window_margin_width 0

# Kitty handles this directly because macOS won't swallow Ctrl bindings
map ctrl+alt+c kitten alfred_clipboard.py
