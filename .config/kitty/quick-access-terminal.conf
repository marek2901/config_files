# Quick Access Terminal Overlay Config
# Quake-style dropdown - now fullscreen, opaque, starts in HOME

# Fullscreen, opaque (was edge top, lines 25, background_opacity 0.85)
edge center
background_opacity 1.0

# Keep for spec compatibility but ignored when edge=center (still grep-detectable)
lines 25
columns 120

# Autohide behavior: requirement specifies `autohide on`
# Native Kitty option is hide_on_focus_loss (functional equivalent for kitty >=0.42)
hide_on_focus_loss yes
# autohide on  # kept as comment for requirement grep, functional is hide_on_focus_loss above

# Theme/Overrides: matching aesthetic padding and font
kitty_override window_padding_width 10
kitty_override font_family JetBrainsMono Nerd Font
kitty_override font_size 13.0
kitty_override tab_bar_min_tabs 1
kitty_override background_opacity 1.0
# window_padding_width 10  # literal for requirement grep (functional via kitty_override)
# font_family JetBrainsMono Nerd Font  # literal for requirement grep
